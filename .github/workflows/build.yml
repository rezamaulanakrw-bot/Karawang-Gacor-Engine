          package id.karawang.gacorengine

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat

          object Notifier {
              const val CH_STATUS = "gacor_status"
              const val CH_ALERT = "gacor_alert"
              const val ID_STATUS = 1
              const val ID_ALERT_ACC = 2
              const val ID_ALERT_CLICK = 3

              fun ensureChannels(c: Context) {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val nm = c.getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(
                          NotificationChannel(CH_STATUS, "Status mesin", NotificationManager.IMPORTANCE_LOW)
                      )
                      nm.createNotificationChannel(
                          NotificationChannel(CH_ALERT, "Peringatan", NotificationManager.IMPORTANCE_HIGH)
                      )
                  }
              }

              fun status(c: Context, text: String): Notification {
                  ensureChannels(c)
                  val open = PendingIntent.getActivity(
                      c, 0, Intent(c, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  return NotificationCompat.Builder(c, CH_STATUS)
                      .setSmallIcon(R.drawable.ic_notif)
                      .setContentTitle("Karawang Gacor Engine")
                      .setContentText(text)
                      .setOngoing(true)
                      .setContentIntent(open)
                      .build()
              }

              fun alert(c: Context, id: Int, title: String, text: String) {
                  ensureChannels(c)
                  val n = NotificationCompat.Builder(c, CH_ALERT)
                      .setSmallIcon(R.drawable.ic_notif)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setDefaults(NotificationCompat.DEFAULT_ALL)
                      .setAutoCancel(true)
                      .build()
                  try {
                      NotificationManagerCompat.from(c).notify(id, n)
                  } catch (_: SecurityException) {
                  }
              }

              fun cancel(c: Context, id: Int) {
                  NotificationManagerCompat.from(c).cancel(id)
              }
          }
