          mkdir -p "app/src/main/java/id/karawang/gacorengine"
          cat > "app/src/main/java/id/karawang/gacorengine/Util.kt" <<'GACOR_EOF'
          package id.karawang.gacorengine

          import android.Manifest
          import android.content.ComponentName
          import android.content.Context
          import android.content.pm.PackageManager
          import android.provider.Settings

          object Util {
              fun isAccessibilityOn(c: Context): Boolean {
                  val enabled = Settings.Secure.getString(
                      c.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  val me = ComponentName(c, GacorService::class.java).flattenToString()
                  return enabled.split(':').any { it.equals(me, ignoreCase = true) }
              }

              fun hasSecureSettings(c: Context): Boolean =
                  c.checkSelfPermission(Manifest.permission.WRITE_SECURE_SETTINGS) == PackageManager.PERMISSION_GRANTED

              // Menyalakan layanan aksesibilitas sendiri. Butuh WRITE_SECURE_SETTINGS
              // (diberikan lewat Shizuku / ADB, lihat kartu SETUP PAKSA).
              fun enableAccessibility(c: Context): Boolean {
                  if (!hasSecureSettings(c)) return false
                  return try {
                      val me = ComponentName(c, GacorService::class.java).flattenToString()
                      val cur = Settings.Secure.getString(
                          c.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                      ) ?: ""
                      val list = cur.split(':').filter { it.isNotBlank() }.toMutableList()
                      if (!list.any { it.equals(me, ignoreCase = true) }) list.add(me)
                      Settings.Secure.putString(
                          c.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES, list.joinToString(":")
                      )
                      Settings.Secure.putString(c.contentResolver, Settings.Secure.ACCESSIBILITY_ENABLED, "1")
                      true
                  } catch (e: Exception) {
                      false
                  }
              }
          }
