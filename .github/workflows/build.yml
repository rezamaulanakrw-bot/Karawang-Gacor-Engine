          mkdir -p "app/src/main/java/id/karawang/gacorengine"
          cat > "app/src/main/java/id/karawang/gacorengine/ShizukuHelper.kt" <<'GACOR_EOF'
          package id.karawang.gacorengine

          import android.content.Context
          import android.content.pm.PackageManager
          import rikka.shizuku.Shizuku

          object ShizukuHelper {

              fun isRunning(): Boolean = try {
                  Shizuku.pingBinder()
              } catch (e: Throwable) {
                  false
              }

              fun hasPermission(): Boolean = try {
                  isRunning() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
              } catch (e: Throwable) {
                  false
              }

              // pasangan (nama singkat, perintah)
              fun commands(pkg: String): List<Pair<String, String>> = listOf(
                  Pair("Izin pengaturan terbatas", "appops set $pkg ACCESS_RESTRICTED_SETTINGS allow"),
                  Pair("Izin tombol melayang", "appops set $pkg SYSTEM_ALERT_WINDOW allow"),
                  Pair("Izin ubah setelan aman", "pm grant $pkg android.permission.WRITE_SECURE_SETTINGS"),
                  Pair("Izin notifikasi", "pm grant $pkg android.permission.POST_NOTIFICATIONS"),
                  Pair("Bebas hemat baterai", "dumpsys deviceidle whitelist +$pkg")
              )

              private fun exec(cmd: String): String {
                  val m = Shizuku::class.java.getDeclaredMethod(
                      "newProcess",
                      Array<String>::class.java, Array<String>::class.java, String::class.java
                  )
                  m.isAccessible = true
                  val p = m.invoke(null, arrayOf("sh", "-c", cmd), null, null) as Process
                  val out = p.inputStream.bufferedReader().readText()
                  val err = p.errorStream.bufferedReader().readText()
                  p.waitFor()
                  return (out + err).trim()
              }

              fun runSetup(ctx: Context, done: (String) -> Unit) {
                  Thread {
                      val sb = StringBuilder()
                      try {
                          for (c in commands(ctx.packageName)) {
                              val r = exec(c.second)
                              sb.append("• ").append(c.first).append(": ")
                                  .append(if (r.isEmpty()) "OK" else r.take(70)).append('\n')
                          }
                      } catch (e: Throwable) {
                          sb.append("Gagal menjalankan perintah: ").append(e.javaClass.simpleName)
                              .append(' ').append(e.message ?: "").append('\n')
                      }
                      val enabled = Util.enableAccessibility(ctx)
                      sb.append(
                          if (enabled) "• Aksesibilitas: DIAKTIFKAN otomatis"
                          else "• Aksesibilitas: belum aktif (izin ubah setelan aman belum diberikan)"
                      )
                      done(sb.toString())
                  }.start()
              }
          }
