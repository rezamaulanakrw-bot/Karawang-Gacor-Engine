          package id.karawang.gacorengine

          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper

          class GuardService : Service() {

              private val handler = Handler(Looper.getMainLooper())
              private var alerted = false

              private val tick = object : Runnable {
                  override fun run() {
                      val ctx = this@GuardService
                      val active = Cfg.b(ctx, "active")
                      var acc = Util.isAccessibilityOn(ctx)
                      if (!acc && active && Util.enableAccessibility(ctx)) {
                          acc = Util.isAccessibilityOn(ctx)
                      }
                      val dry = if (Cfg.b(ctx, "dry")) " (simulasi)" else ""
                      val text = when {
                          !acc -> "PERINGATAN: aksesibilitas mati"
                          active -> "Mesin BERJALAN$dry • ${Cfg.todayClicks(ctx)} klik hari ini"
                          else -> "Mesin berhenti (siaga)"
                      }
                      getSystemService(NotificationManager::class.java)
                          .notify(Notifier.ID_STATUS, Notifier.status(ctx, text))

                      if (!acc && active) {
                          if (!alerted) {
                              alerted = true
                              Notifier.alert(ctx, Notifier.ID_ALERT_ACC, "Aksesibilitas mati",
                                  "Nyalakan lagi di Pengaturan → Aksesibilitas agar mesin bekerja.")
                          }
                      } else {
                          alerted = false
                          Notifier.cancel(ctx, Notifier.ID_ALERT_ACC)
                      }
                      handler.postDelayed(this, 8000)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val n = Notifier.status(this, "Mesin siaga")
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(Notifier.ID_STATUS, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(Notifier.ID_STATUS, n)
                  }
                  handler.removeCallbacks(tick)
                  handler.post(tick)
                  return START_STICKY
              }

              override fun onDestroy() {
                  handler.removeCallbacks(tick)
                  super.onDestroy()
              }
          }
