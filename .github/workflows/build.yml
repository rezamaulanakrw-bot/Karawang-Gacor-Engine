                      "• Jadwal: $jadwal\n" +
                      "• Target: Maxim Driver (${GacorService.TARGET_PKG})"
                  tvShizuku.text = "• Shizuku: ${if (ShizukuHelper.isRunning()) "JALAN" else "belum jalan"}" +
                      " • izin: ${if (ShizukuHelper.hasPermission()) "OK" else "belum"}\n" +
                      "• Izin ubah setelan aman: ${if (Util.hasSecureSettings(this)) "ADA" else "belum"}"
                  tvStats.text = Cfg.statsText(this)
                  val sn = Cfg.s(this, "snapshot")
                  tvSnap.text = if (sn.isBlank()) "(belum ada snapshot)" else sn
                  tvLog.text = Cfg.getLog(this)
              }
          }
