name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buat struktur proyek
        run: |
          mkdir -p gacor_build && cd gacor_build
          mkdir -p "app"
          cat > "app/build.gradle" <<'GACOR_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'id.karawang.gacorengine'
              compileSdk 34

              defaultConfig {
                  applicationId "id.karawang.gacorengine"
                  minSdk 26
                  targetSdk 34
                  versionCode 7
                  versionName "3.2"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'dev.rikka.shizuku:api:13.1.5'
              implementation 'dev.rikka.shizuku:provider:13.1.5'
          }
          GACOR_EOF
          mkdir -p "app"
          cat > "app/proguard-rules.pro" <<'GACOR_EOF'
          # no special rules
          GACOR_EOF
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'GACOR_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission
                  android:name="android.permission.WRITE_SECURE_SETTINGS"
                  tools:ignore="ProtectedPermissions" />

              <queries>
                  <package android:name="moe.shizuku.privileged.api" />
              </queries>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Gacor">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".GacorService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />

                  <service
                      android:name=".GuardService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="driver_order_assistant" />
                  </service>

                  <service
                      android:name=".FloatingWidgetService"
                      android:exported="false" />
              </application>
          </manifest>
          GACOR_EOF
          mkdir -p "app/src/main/java/id/karawang/gacorengine"
          cat > "app/src/main/java/id/karawang/gacorengine/Cfg.kt" <<'GACOR_EOF'
          package id.karawang.gacorengine

          import android.content.Context
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object Cfg {

              private val D: Map<String, String> = mapOf(
                  "active" to "0",
                  "dry" to "0",
                  "bike_on" to "1", "bike_min" to "8000", "bike_pick_km" to "3",
                  "bike_inc" to "", "bike_exc" to "",
                  "del_on" to "1", "del_min" to "10000", "del_pick_km" to "4",
                  "del_inc" to "", "del_exc" to "",
                  "other_on" to "0", "other_min" to "15000",
                  "global_exc" to "bandara, perbaikan rating",
                  "kw_delivery" to "delivery, kurir, express, food, makanan, barang, paket, titip, belanja",
                  "kw_other" to "car, mobil, taksi, truk, cargo",
                  "accept_words" to "minta order, ambil order, terima, lanjut",
                  "confirm_words" to "ya bisa, bisa",
                  "confirm_ms" to "8000",
                  "delay_min" to "0", "delay_max" to "80",
                  "scan_ms" to "100", "cooldown_ms" to "2500",
                  "fail_limit" to "5", "deep_scan" to "0",
                  "sched_on" to "0", "sched_start" to "6", "sched_end" to "22"
              )

              private fun sp(c: Context) = c.getSharedPreferences("gacor3", Context.MODE_PRIVATE)

              fun s(c: Context, key: String): String = sp(c).getString(key, D[key] ?: "") ?: ""
              fun set(c: Context, key: String, v: String) = sp(c).edit().putString(key, v).apply()
              fun b(c: Context, key: String): Boolean = s(c, key) == "1"
              fun i(c: Context, key: String): Int =
                  s(c, key).trim().toIntOrNull() ?: (D[key]?.toIntOrNull() ?: 0)
              fun d(c: Context, key: String): Double =
                  s(c, key).trim().replace(',', '.').toDoubleOrNull() ?: (D[key]?.toDoubleOrNull() ?: 0.0)
              fun list(c: Context, key: String): List<String> =
                  s(c, key).split(",").map { it.trim().lowercase() }.filter { it.isNotEmpty() }

              fun resetDefaults(c: Context) {
                  val e = sp(c).edit()
                  for (k in D.keys) {
                      if (k != "active") e.remove(k)
                  }
                  e.apply()
              }

              // ---------- statistik harian ----------
              private fun today(): String = SimpleDateFormat("yyyyMMdd", Locale.US).format(Date())

              private fun roll(c: Context) {
                  if (s(c, "stat_date") != today()) {
                      sp(c).edit()
                          .putString("stat_date", today())
                          .putString("stat_clicks", "0").putString("stat_sum", "0")
                          .putString("stat_bike", "0").putString("stat_del", "0")
                          .putString("stat_other", "0").putString("stat_rej", "0")
                          .apply()
                  }
              }

              fun resetStats(c: Context) {
                  set(c, "stat_date", "")
                  roll(c)
              }

              fun addClick(c: Context, type: String, price: Int) {
                  roll(c)
                  val e = sp(c).edit()
                  e.putString("stat_clicks", (i(c, "stat_clicks") + 1).toString())
                  e.putString("stat_sum", (i(c, "stat_sum") + price).toString())
                  val k = when (type) { "bike" -> "stat_bike"; "del" -> "stat_del"; else -> "stat_other" }
                  e.putString(k, (i(c, k) + 1).toString())
                  e.apply()
              }

              fun addReject(c: Context) {
                  roll(c)
                  set(c, "stat_rej", (i(c, "stat_rej") + 1).toString())
              }

              fun todayClicks(c: Context): Int {
                  roll(c)
                  return i(c, "stat_clicks")
              }

              fun statsText(c: Context): String {
                  roll(c)
                  val sum = i(c, "stat_sum")
                  return "Order diklik: ${i(c, "stat_clicks")}  (Bike ${i(c, "stat_bike")}, " +
                      "Delivery ${i(c, "stat_del")}, Lain ${i(c, "stat_other")})\n" +
                      "Perkiraan nilai order: Rp ${"%,d".format(sum)}\n" +
                      "Ditolak filter: ${i(c, "stat_rej")}"
              }

              // ---------- log ----------
              fun log(c: Context, line: String) {
                  val t = SimpleDateFormat("HH:mm:ss", Locale.US).format(Date())
                  val old = s(c, "log")
                  val lines = (listOf("$t $line") + old.split("\n").filter { it.isNotBlank() }).take(12)
                  set(c, "log", lines.joinToString("\n"))
              }

              fun getLog(c: Context): String {
                  val l = s(c, "log")
                  return if (l.isBlank()) "(belum ada)" else l
              }
          }
          GACOR_EOF
          mkdir -p "app/src/main/java/id/karawang/gacorengine"
          cat > "app/src/main/java/id/karawang/gacorengine/FloatingWidgetService.kt" <<'GACOR_EOF'
          package id.karawang.gacorengine

          import android.annotation.SuppressLint
          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class FloatingWidgetService : Service() {

              private var wm: WindowManager? = null
              private var row: LinearLayout? = null
              private val handler = Handler(Looper.getMainLooper())
              private var toggle: Button? = null

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun bg(color: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(color)
                  g.cornerRadius = dp(8).toFloat()
                  return g
              }

              private fun smallBtn(label: String, color: Int): Button {
                  val b = Button(this)
                  b.text = label
                  b.textSize = 11f
                  b.setTextColor(Color.WHITE)
                  b.setTypeface(null, Typeface.BOLD)
                  b.setPadding(0, 0, 0, 0)
                  b.minWidth = 0
                  b.minHeight = 0
                  b.minimumWidth = 0
                  b.minimumHeight = 0
                  b.isAllCaps = false
                  b.background = bg(color)
                  return b
              }

              private fun updateToggle() {
                  val t = toggle ?: return
                  if (Cfg.b(this, "active")) {
                      t.text = "SIKAT: ON"
                      t.background = bg(0xFF10B981.toInt())
                  } else {
                      t.text = "SIKAT: OFF"
                      t.background = bg(0xFFEF4444.toInt())
                  }
              }

              private val refresh = object : Runnable {
                  override fun run() {
                      updateToggle()
                      handler.postDelayed(this, 1500)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              @SuppressLint("ClickableViewAccessibility")
              override fun onCreate() {
                  super.onCreate()

                  val r = LinearLayout(this)
                  r.orientation = LinearLayout.HORIZONTAL
                  r.gravity = Gravity.CENTER_VERTICAL
                  r.background = bg(0xCC0F172A.toInt())
                  r.setPadding(dp(4), dp(4), dp(6), dp(4))

                  val handle = TextView(this)
                  handle.text = "≡"
                  handle.textSize = 22f
                  handle.setTextColor(Color.WHITE)
                  handle.setPadding(dp(8), 0, dp(10), 0)

                  val tg = smallBtn("SIKAT: OFF", 0xFFEF4444.toInt())
                  toggle = tg
                  val snap = smallBtn("SNAP", 0xFF3B82F6.toInt())

                  r.addView(handle)
                  r.addView(tg, LinearLayout.LayoutParams(dp(84), dp(38)))
                  val lpSnap = LinearLayout.LayoutParams(dp(54), dp(38))
                  lpSnap.leftMargin = dp(6)
                  r.addView(snap, lpSnap)
                  row = r

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = 60
                  params.y = 280

                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm?.addView(r, params)

                  tg.setOnClickListener {
                      Cfg.set(this, "active", if (Cfg.b(this, "active")) "0" else "1")
                      updateToggle()
                  }

                  snap.setOnClickListener {
                      val s = GacorService.instance
                      if (s == null) {
                          Toast.makeText(this, "Aksesibilitas belum aktif", Toast.LENGTH_SHORT).show()
                      } else {
                          val ok = s.snapshotNow()
                          Toast.makeText(
                              this,
                              if (ok) "Snapshot tersimpan, lihat di aplikasi" else "Buka layar Maxim dulu",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }

                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f
                  handle.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = params.x
                              startY = params.y
                              touchX = e.rawX
                              touchY = e.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = startX + (e.rawX - touchX).toInt()
                              params.y = startY + (e.rawY - touchY).toInt()
                              wm?.updateViewLayout(r, params)
                              true
                          }
                          else -> true
                      }
                  }

                  handler.post(refresh)
              }

              override fun onDestroy() {
                  handler.removeCallbacks(refresh)
                  row?.let {
                      try { wm?.removeView(it) } catch (_: Exception) { }
                  }
                  row = null
                  super.onDestroy()
              }
          }
          GACOR_EOF
          mkdir -p "app/src/main/java/id/karawang/gacorengine"
          cat > "app/src/main/java/id/karawang/gacorengine/GacorService.kt" <<'GACOR_EOF'
          package id.karawang.gacorengine

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.util.Log
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import java.util.Calendar
          import kotlin.random.Random

          class GacorService : AccessibilityService() {

              companion object {
                  private const val TAG = "GacorEngine"
                  const val TARGET_PKG = "com.taxsee.driver"

                  @Volatile
                  var instance: GacorService? = null

                  private val PRICE_REGEX = Regex("rp\\.?\\s*([0-9][0-9.,]*)")
                  private val KM_REGEX = Regex("([0-9]+(?:[.,][0-9]+)?)\\s*km")
                  private val METER_REGEX = Regex("(?<![a-z0-9])([0-9]{2,4})\\s*m(?![a-z0-9])")
              }

              class Hit(val node: AccessibilityNodeInfo, val label: String)
              class Info(val type: String, val price: Int, val pickKm: Double)

              private val handler = Handler(Looper.getMainLooper())
              private var lastScan = 0L
              private var pending = false
              private var lastLabel = ""
              private var lastClickAt = 0L
              private var lastAcceptAt = 0L
              private var confirmUntil = 0L
              private var fails = 0
              private var lastLogMsg = ""
              private var lastLogAt = 0L
              private var acceptWords: List<String> = emptyList()
              private var confirmWords: List<String> = emptyList()
              private var cfgAt = 0L

              // ------------------------------------------------------------------
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  if (event.packageName?.toString() != TARGET_PKG) return
                  if (!Cfg.b(this, "active")) return
                  if (!inSchedule()) return

                  val now = SystemClock.uptimeMillis()
                  val gap = Cfg.i(this, "scan_ms").coerceAtLeast(20)
                  if (now - lastScan < gap) return
                  lastScan = now
                  if (pending) return

                  if (now - cfgAt > 1500 || acceptWords.isEmpty()) {
                      acceptWords = Cfg.list(this, "accept_words")
                      confirmWords = Cfg.list(this, "confirm_words")
                      cfgAt = now
                  }

                  val root = rootInActiveWindow ?: return
                  val dry = Cfg.b(this, "dry")

                  // Langkah konfirmasi (hanya sesaat setelah klik ambil order)
                  if (lastAcceptAt > 0 && now - lastAcceptAt < Cfg.i(this, "confirm_ms") && now > confirmUntil) {
                      val c = findButton(root, confirmWords, true)
                      if (c != null) {
                          confirmUntil = now + 800
                          if (dry) {
                              logThrottled("SIMULASI: akan konfirmasi \"${c.label}\"")
                          } else {
                              val ok = try { c.node.performAction(AccessibilityNodeInfo.ACTION_CLICK) } catch (e: Exception) { false }
                              Cfg.log(this, "KONFIRMASI \"${c.label}\" " + (if (ok) "OK" else "GAGAL"))
                          }
                          return
                      }
                  }

                  val hit = findButton(root, acceptWords, false) ?: return
                  val same = hit.label == lastLabel
                  if (same && now - lastClickAt < Cfg.i(this, "cooldown_ms")) return
                  if (!same && now - lastClickAt < 400) return

                  val text = collectText(root, 0).lowercase()
                  val info = parse(text)
                  val reason = rejectReason(text, info)
                  if (reason != null) {
                      if (logThrottled("TOLAK ${typeName(info.type)}: $reason")) Cfg.addReject(this)
                      return
                  }

                  if (dry) {
                      logThrottled("SIMULASI: akan klik \"${hit.label}\" - ${describe(info)}")
                      return
                  }

                  val lo = minOf(Cfg.i(this, "delay_min"), Cfg.i(this, "delay_max")).coerceAtLeast(0)
                  val hi = maxOf(Cfg.i(this, "delay_min"), Cfg.i(this, "delay_max")).coerceAtLeast(0)
                  val delay = if (hi <= 0) 0L else Random.nextLong(lo.toLong(), hi.toLong() + 1)

                  if (delay == 0L) {
                      doClick(hit, info)
                  } else {
                      pending = true
                      handler.postDelayed({
                          pending = false
                          if (Cfg.b(this, "active")) doClick(hit, info)
                      }, delay)
                  }
              }

              // ------------------------------------------------------------------
              private fun doClick(hit: Hit, info: Info) {
                  try {
                      hit.node.refresh()
                      val ok = hit.node.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      val t = SystemClock.uptimeMillis()
                      lastLabel = hit.label
                      lastClickAt = t
                      if (ok) {
                          fails = 0
                          lastAcceptAt = t
                          Cfg.addClick(this, info.type, info.price)
                          Cfg.log(this, "KLIK \"${hit.label}\" - ${describe(info)}")
                          Notifier.alert(this, Notifier.ID_ALERT_CLICK, "Order diklik", describe(info))
                      } else {
                          fails++
                          Cfg.log(this, "KLIK GAGAL \"${hit.label}\" ($fails)")
                          if (fails >= Cfg.i(this, "fail_limit").coerceAtLeast(1)) {
                              fails = 0
                              Cfg.set(this, "active", "0")
                              Cfg.log(this, "MESIN DIHENTIKAN: klik gagal beruntun")
                              Notifier.alert(this, Notifier.ID_ALERT_ACC, "Mesin dihentikan",
                                  "Klik gagal beruntun. Cek teks tombol di pengaturan, lalu nyalakan lagi.")
                          }
                      }
                  } catch (e: Exception) {
                      Cfg.log(this, "ERROR klik: ${e.javaClass.simpleName}")
                  }
              }

              // ------------------------------------------------------------------
              private fun inSchedule(): Boolean {
                  if (!Cfg.b(this, "sched_on")) return true
                  val h = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                  val s = Cfg.i(this, "sched_start")
                  val e = Cfg.i(this, "sched_end")
                  if (s == e) return true
                  return if (s < e) (h >= s && h < e) else (h >= s || h < e)
              }

              private fun typeName(t: String): String = when (t) {
                  "bike" -> "BIKE"
                  "del" -> "DELIVERY"
                  else -> "LAIN"
              }

              private fun describe(i: Info): String {
                  val p = if (i.price > 0) "Rp${"%,d".format(i.price)}" else "harga ?"
                  val k = if (i.pickKm > 0) " jemput ${"%.1f".format(i.pickKm)}km" else ""
                  return "${typeName(i.type)} $p$k"
              }

              private fun logThrottled(msg: String): Boolean {
                  val n = SystemClock.uptimeMillis()
                  if (msg == lastLogMsg && n - lastLogAt < 3000) return false
                  lastLogMsg = msg
                  lastLogAt = n
                  Cfg.log(this, msg)
                  return true
              }

              // ------------------------------------------------------------------
              private fun detectType(text: String): String {
                  if (Cfg.list(this, "kw_delivery").any { text.contains(it) }) return "del"
                  if (Cfg.list(this, "kw_other").any { text.contains(it) }) return "other"
                  return "bike"
              }

              private fun parse(text: String): Info {
                  val type = detectType(text)
                  var price = 0
                  val pm = PRICE_REGEX.find(text)
                  if (pm != null) {
                      val raw = pm.groupValues[1].replace(Regex("[.,]00$"), "")
                      price = raw.replace(Regex("[^0-9]"), "").toIntOrNull() ?: 0
                  }
                  var km = 0.0
                  val km1 = KM_REGEX.find(text)
                  if (km1 != null) {
                      km = km1.groupValues[1].replace(',', '.').toDoubleOrNull() ?: 0.0
                  } else {
                      val m1 = METER_REGEX.find(text)
                      if (m1 != null) km = (m1.groupValues[1].toDoubleOrNull() ?: 0.0) / 1000.0
                  }
                  return Info(type, price, km)
              }

              private fun rejectReason(text: String, info: Info): String? {
                  val g = Cfg.list(this, "global_exc").firstOrNull { text.contains(it) }
                  if (g != null) return "kata \"$g\""

                  if (info.type == "other") {
                      if (!Cfg.b(this, "other_on")) return "layanan lain dimatikan"
                      val min = Cfg.i(this, "other_min")
                      if (info.price in 1 until min) return "harga Rp${info.price} < Rp$min"
                      return null
                  }

                  val p = if (info.type == "bike") "bike" else "del"
                  if (!Cfg.b(this, "${p}_on")) return "layanan dimatikan"

                  val ex = Cfg.list(this, "${p}_exc").firstOrNull { text.contains(it) }
                  if (ex != null) return "kata \"$ex\""

                  val inc = Cfg.list(this, "${p}_inc")
                  if (inc.isNotEmpty() && inc.none { text.contains(it) }) return "tidak ada kata kunci ambil"

                  val min = Cfg.i(this, "${p}_min")
                  if (info.price in 1 until min) return "harga Rp${info.price} < Rp$min"

                  val maxKm = Cfg.d(this, "${p}_pick_km")
                  if (maxKm > 0 && info.pickKm > maxKm) {
                      return "jemput ${"%.1f".format(info.pickKm)}km > ${maxKm}km"
                  }
                  return null
              }

              // ------------------------------------------------------------------
              private fun matches(s: String, words: List<String>, exact: Boolean): Boolean {
                  if (s.isEmpty()) return false
                  return words.any { s == it || (!exact && s.startsWith(it)) }
              }

              // Jalur cepat: pencarian teks bawaan sistem (ringan untuk HP RAM kecil)
              private fun findButton(root: AccessibilityNodeInfo, words: List<String>, exact: Boolean): Hit? {
                  if (Cfg.b(this, "deep_scan")) return findButtonDeep(root, 0, words, exact)
                  for (w in words) {
                      val nodes = try { root.findAccessibilityNodeInfosByText(w) } catch (e: Exception) { null }
                      if (nodes == null) continue
                      for (n in nodes) {
                          val t = n.text?.toString()?.lowercase()?.trim() ?: ""
                          val d = n.contentDescription?.toString()?.lowercase()?.trim() ?: ""
                          val label = if (matches(t, words, exact)) t else if (matches(d, words, exact)) d else ""
                          if (label.isEmpty()) continue
                          var x: AccessibilityNodeInfo? = n
                          var up = 0
                          while (x != null && up < 4) {
                              if (x.isClickable && x.isEnabled) return Hit(x, label)
                              x = x.parent
                              up++
                          }
                      }
                  }
                  return null
              }

              // Jalur dalam: telusuri seluruh pohon tampilan (lebih berat)
              private fun findButtonDeep(
                  node: AccessibilityNodeInfo, depth: Int, words: List<String>, exact: Boolean
              ): Hit? {
                  if (depth > 25) return null
                  val t = node.text?.toString()?.lowercase()?.trim() ?: ""
                  val d = node.contentDescription?.toString()?.lowercase()?.trim() ?: ""
                  val label = if (matches(t, words, exact)) t else if (matches(d, words, exact)) d else ""
                  if (label.isNotEmpty()) {
                      var n: AccessibilityNodeInfo? = node
                      var up = 0
                      while (n != null && up < 4) {
                          if (n.isClickable && n.isEnabled) return Hit(n, label)
                          n = n.parent
                          up++
                      }
                  }
                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      val found = findButtonDeep(child, depth + 1, words, exact)
                      if (found != null) return found
                  }
                  return null
              }

              private fun collectText(node: AccessibilityNodeInfo, depth: Int): String {
                  if (depth > 25) return ""
                  val sb = StringBuilder()
                  node.text?.let { sb.append(it).append(' ') }
                  node.contentDescription?.let { sb.append(it).append(' ') }
                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      sb.append(collectText(child, depth + 1))
                  }
                  return sb.toString()
              }

              // ------------------------------------------------------------------
              // Snapshot layar Maxim (dipanggil dari tombol SNAP di widget)
              fun snapshotNow(): Boolean {
                  val root = rootInActiveWindow
                  if (root == null || root.packageName?.toString() != TARGET_PKG) {
                      Cfg.log(this, "SNAPSHOT gagal: layar aktif bukan Maxim Driver")
                      return false
                  }
                  val lines = ArrayList<String>()
                  dump(root, 0, lines)
                  val info = parse(collectText(root, 0).lowercase())
                  val head = "Terbaca: ${describe(info)}\n----"
                  Cfg.set(this, "snapshot", head + "\n" + lines.take(90).joinToString("\n"))
                  Cfg.log(this, "SNAPSHOT tersimpan (${lines.size} baris)")
                  return true
              }

              private fun dump(node: AccessibilityNodeInfo, depth: Int, out: MutableList<String>) {
                  if (depth > 25 || out.size > 120) return
                  val t = node.text?.toString()?.trim() ?: ""
                  val d = node.contentDescription?.toString()?.trim() ?: ""
                  val label = if (t.isNotEmpty()) t else d
                  if (label.isNotEmpty()) {
                      out.add("• " + label.replace("\n", " ") + (if (node.isClickable) "   [TOMBOL]" else ""))
                  }
                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      dump(child, depth + 1, out)
                  }
              }

              // ------------------------------------------------------------------
              override fun onServiceConnected() {
                  instance = this
                  Cfg.log(this, "Layanan terhubung")
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  if (Cfg.b(this, "active")) {
                      Notifier.alert(this, Notifier.ID_ALERT_ACC, "Aksesibilitas terputus",
                          "Nyalakan lagi di Pengaturan → Aksesibilitas.")
                  }
                  return super.onUnbind(intent)
              }

              override fun onInterrupt() {
                  Log.d(TAG, "Layanan terputus")
              }
          }
