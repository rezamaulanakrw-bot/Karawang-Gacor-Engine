              private fun toggleEngine() {
                  // simpan dulu isi kolom agar pengaturan terbaru terpakai
                  for (f in fields) Cfg.set(this, f.first, f.second.text.toString())

                  if (!Util.isAccessibilityOn(this) && !Util.enableAccessibility(this)) {
                      Toast.makeText(this, "Aktifkan aksesibilitas dulu", Toast.LENGTH_LONG).show()
                      return
                  }
                  val now = !Cfg.b(this, "active")
                  Cfg.set(this, "active", if (now) "1" else "0")
                  if (now) {
                      try {
                          ContextCompat.startForegroundService(this, Intent(this, GuardService::class.java))
                      } catch (e: Exception) {
                          Toast.makeText(this, "Notifikasi gagal: ${e.javaClass.simpleName}", Toast.LENGTH_LONG).show()
                      }
                      if (Settings.canDrawOverlays(this)) {
                          startService(Intent(this, FloatingWidgetService::class.java))
                      }
                  } else {
